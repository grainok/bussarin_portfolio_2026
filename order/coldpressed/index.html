<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Fresh Orders</title><style>body{font:16px system-ui;background:#f5f8f4;color:#183e2c;margin:0}main{max-width:780px;margin:auto;padding:20px}h1{font-size:24px}.box{background:white;padding:18px;border-radius:16px;margin:12px 0;border:1px solid #dce8dc}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #c9d7ca;box-sizing:border-box}input,select{width:100%}button{background:#246b4d;color:white;border:0}button:disabled{opacity:.5}label{display:block;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#647a6c}.item{border-top:1px solid #e0e9df;padding:12px 0}.hidden{display:none}#message{color:#b33328}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style><main><p class="muted">BUSSSIO · PRIVATE</p><h1>🌿 Morning Fresh Orders</h1><p id="message"></p><section id="login" class="box"><h2>เข้าสู่ระบบ</h2><form id="loginForm"><label>รหัสผ่านสำหรับเจ้าของร้าน</label><input id="password" type="password" required autocomplete="current-password"><p><button>เข้าสู่ระบบ</button></p></form></section><section id="dashboard" class="hidden"><div class="box row"><div><strong id="summary">กำลังโหลด...</strong><p class="muted">ไม่รวมออเดอร์ที่ยกเลิก</p></div><button id="logout">ออกจากระบบ</button></div><div class="box"><div class="row"><h2>รายการสั่งซื้อ</h2><button id="export">ส่งออก CSV</button></div><input id="search" placeholder="ค้นหาชื่อหรือบ้านเลขที่"><div id="orders"></div></div><div class="box" id="editor"><h2>เพิ่ม / แก้ไขออเดอร์</h2><form id="form"><input type="hidden" id="id"><div class="grid"><div><label>วันที่</label><input id="date" type="date" required></div><div><label>ชื่อลูกค้า</label><input id="name" required maxlength="120"></div><div><label>บ้านเลขที่</label><input id="address" maxlength="240"></div><div><label>สูตร</label><input id="product" maxlength="200"></div><div><label>จำนวนขวด</label><input id="quantity" type="number" min="1" max="9999" required></div><div><label>ยอดเงิน (บาท)</label><input id="amount" type="number" min="0" step=".01"></div><div><label>ชำระเงิน</label><select id="paid"><option value="false">ยังไม่โอน</option><option value="true">โอนแล้ว</option></select></div><div><label>จัดส่ง</label><select id="delivered"><option value="false">ยังไม่ส่ง</option><option value="true">ส่งแล้ว</option></select></div><div><label>สถานะ</label><select id="status"><option value="confirmed">—</option><option value="pending">รอยืนยัน</option><option value="cancelled">ยกเลิก</option></select></div><div><label>หมายเหตุ</label><input id="notes" maxlength="500"></div></div><p><button>บันทึกออเดอร์</button> <button type="button" id="clear">ล้างฟอร์ม</button></p></form></div><div class="box"><h2>เริ่มต้นใช้งาน</h2><p class="muted">นำเข้าออเดอร์ 8 รายการจาก 15–18 ต.ค. 2026 เพียงครั้งเดียว (ไม่มีราคาที่ไม่ได้ระบุ)</p><button id="import">นำเข้ารายการเดิม</button></div></section></main><script src="./app.js" defer></script></html>
